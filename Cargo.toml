[workspace]
members = [
    "examples/animations",
    "examples/canvas_stress_test",
    "examples/canvas_waves",
    "examples/clipboard",
    "examples/colors_rgb",
    "examples/demo",
    "examples/demo2",
    "examples/minimal",
    "examples/pong",
    "examples/shared",
    "examples/tauri/src-tauri",
    "examples/text_area",
    "examples/user_input",
    "examples/website",
    "examples/world_map",
]
resolver = "2"

[package]
name = "ratzilla"
version = "0.2.0"
description = "Build terminal-themed web applications with Ratatui and WebAssembly"
authors = ["Orhun Parmaksız <orhunparmaksiz@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/orhun/ratzilla"
repository = "https://github.com/orhun/ratzilla"
keywords = ["tui", "webassembly", "ratatui"]
categories = ["wasm"]
include = ["src/**/*", "Cargo.*", "LICENSE", "README.md", "CHANGELOG.md"]
edition = "2021"

[dependencies]
web-sys = { version = "0.3.81", features = [
    'console',
    'CanvasRenderingContext2d',
    'Document',
    'Element',
    'Headers',
    'HtmlCanvasElement',
    'HtmlElement',
    'KeyboardEvent',
    'Location',
    'MouseEvent',
    'Navigator',
    'Node',
    'Performance',
    'Request',
    'RequestInit',
    'RequestMode',
    'Screen',
    'WebGl2RenderingContext',
    'WebGlBuffer',
    'WebGlProgram',
    'WebGlRenderingContext',
    'WebGlShader',
    'WebGlTexture',
    'WebGlUniformLocation',
    'WebGlVertexArrayObject',
    'Window',
] }
wasm-bindgen = "0.2.106"
js-sys = "0.3"
compact_str = "0.9.0"
ratatui = { version = "0.29", default-features = false, features = ["all-widgets"] }
console_error_panic_hook = "0.1.7"
thiserror = "2.0.12"
bitvec = { version = "1.0.1", default-features = false, features = ["alloc", "std"] }
beamterm-renderer = "0.9.0"
