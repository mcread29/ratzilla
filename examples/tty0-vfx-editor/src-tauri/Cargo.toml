[package]
name = "tty0-vfx-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "tty0_vfx_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
thiserror = "2.0.18"
open = "5.3.2"
tty0-vfx-core = { path = "../../tty0-vfx-core" }
